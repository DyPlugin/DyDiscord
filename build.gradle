plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}
group = 'dev.dydiscord'
version = '1.1.0'
repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}
dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    compileOnly 'net.kyori:adventure-text-minimessage:4.16.0'
    compileOnly 'net.kyori:adventure-text-serializer-legacy:4.16.0'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    implementation('net.dv8tion:JDA:6.7.0') {
        exclude module: 'opus-java'
        exclude module: 'tink'
    }
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'org.yaml:snakeyaml:2.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'org.slf4j:slf4j-jdk14:2.0.19'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'net.luckperms:api:5.4'
    testImplementation 'org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    testImplementation 'net.kyori:adventure-text-minimessage:4.16.0'
    testImplementation 'net.kyori:adventure-text-serializer-legacy:4.16.0'
    testImplementation 'me.clip:placeholderapi:2.12.3'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
test { useJUnitPlatform() }
def pluginVersion = project.version.toString()
processResources { inputs.property('pluginVersion', pluginVersion); filesMatching('plugin.yml') { expand(version: pluginVersion) } }
def noticesDir = layout.buildDirectory.dir('generated/notices')
tasks.register('collectDependencyNotices') {
    outputs.dir(noticesDir)
    doLast {
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            copy {
                from zipTree(artifact.file)
                include '**/LICENSE*', '**/NOTICE*', '**/COPYING*', '**/license*', '**/notice*', '**/copying*'
                into noticesDir.get().dir('META-INF/licenses/' + artifact.moduleVersion.id.toString().replace(':', '_'))
            }
        }
    }
}
processResources.dependsOn collectDependencyNotices
sourceSets.main.resources.srcDir(noticesDir)
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
def distributionRuntime = configurations.runtimeClasspath
def minimizedCollections = providers.provider {
    distributionRuntime.resolvedConfiguration.resolvedArtifacts.findAll {
        (it.moduleVersion.id.group == 'net.sf.trove4j' && it.name == 'core') ||
        (it.moduleVersion.id.group == 'org.apache.commons' && it.name == 'commons-collections4')
    }.collect { it.file }
}
def retainedRuntime = distributionRuntime.minus(files(minimizedCollections))
def runtimeCoordinates = providers.provider {
    distributionRuntime.resolvedConfiguration.resolvedArtifacts.collect {
        "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}".toString()
    }.unique().sort()
}
def thinDescriptor = layout.buildDirectory.file('generated/small/plugin.yml')
tasks.register('generateSmallDescriptor') {
    dependsOn processResources
    inputs.file(layout.buildDirectory.file('resources/main/plugin.yml'))
    inputs.property('libraries', runtimeCoordinates)
    outputs.file(thinDescriptor)
    doLast {
        def destination = thinDescriptor.get().asFile
        destination.parentFile.mkdirs()
        destination.setText(layout.buildDirectory.file('resources/main/plugin.yml').get().asFile.getText('UTF-8') +
            '\n# Resolved by Spigot/Paper from Maven Central and cached by the server.\nlibraries:\n' +
            runtimeCoordinates.get().collect { '  - "' + it + '"' }.join('\n') + '\n', 'UTF-8')
    }
}
tasks.register('smallJar', Jar) {
    dependsOn classes, generateSmallDescriptor
    archiveBaseName = 'DyDiscord'
    archiveVersion = project.version
    archiveClassifier = ''
    from(sourceSets.main.output) { exclude 'plugin.yml' }
    from(thinDescriptor)
}
shadowJar {
    archiveBaseName = 'DyDiscord'
    archiveVersion = project.version
    archiveClassifier = 'standalone'
    mergeServiceFiles()
    // Only minimize statically linked collection helpers. Preserve reflection,
    // service loading, serializers and every SQLite platform/native unchanged.
    // Dependency exclusions also exclude their children in Shadow. Select exact
    // inputs instead, and make every other runtime JAR an analysis entry point.
    minimize()
    toMinimize.setFrom(minimizedCollections)
    apiJars.setFrom(retainedRuntime)
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    relocate 'net.dv8tion.jda', 'dev.dydiscord.lib.jda'
    relocate 'okhttp3', 'dev.dydiscord.lib.okhttp3'
    relocate 'okio', 'dev.dydiscord.lib.okio'
    relocate 'kotlin', 'dev.dydiscord.lib.kotlin'
    relocate 'org.yaml.snakeyaml', 'dev.dydiscord.lib.yaml'
    relocate 'org.slf4j', 'dev.dydiscord.lib.slf4j'
    relocate 'com.fasterxml', 'dev.dydiscord.lib.fasterxml'
    relocate 'gnu.trove', 'dev.dydiscord.lib.trove'
    relocate 'com.neovisionaries', 'dev.dydiscord.lib.neovisionaries'
    relocate 'org.apache.commons.collections4', 'dev.dydiscord.lib.collections4'
    // SQLite native resource lookup relies on org.sqlite; retain driver and natives.
}
jar { archiveClassifier = 'plain' }
build.dependsOn shadowJar
build.dependsOn smallJar
test.dependsOn shadowJar
test.dependsOn smallJar
test {
    inputs.files(distributionRuntime)
    doFirst {
        systemProperty 'dydiscord.version', project.version.toString()
        systemProperty 'dydiscord.runtime.coordinates', runtimeCoordinates.get().join(',')
        systemProperty 'dydiscord.runtime.classpath', distributionRuntime.asPath
    }
}
dependencyLocking { lockAllConfigurations() }
