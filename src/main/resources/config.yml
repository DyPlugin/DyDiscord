# Setting descriptions follow their settings.
config-version: 2
# Managed schema version. Do not edit.
prefix: "&7[&9DyDiscord&7]"
# Chat prefix. Minecraft color codes such as &9 are supported.
lang: auto
# auto uses a saved player preference, then the client language; en, tr, de, es or ru forces the game language.
server-name: "Minecraft Server"
# Displayed server name on the account panel.
discord:
# Discord invitation shown by the root command.
  invite-url: ""
  # HTTPS discord.gg or discord.com/invite link; blank creates a reusable permanent invitation when the bot has Create Invite permission.
linking:
# Account linking rules; UUID and current online session identify the player.
  enabled: true
  # Works with either online-mode value. On offline servers, your login system must block all DyDiscord commands until authentication completes.
  code-length: 6
  # Random code length (6-16); existing explicit values are preserved on upgrade.
  code-expiry-seconds: 300
  # Code lifetime in seconds (30-900).
  generation-cooldown-seconds: 30
  # Minimum wait before requesting another code, in seconds (5-300).
  max-attempts: 5
  # Maximum failed code attempts per Discord user (1-10).
  attempt-window-seconds: 300
  # Failed-attempt window in seconds (30-900).
  confirmation-timeout-seconds: 30
  # Time allowed to confirm unlinking, in seconds (10-120).
  require-to-join: false
  # Players without a linked Discord account cannot join; the kick screen shows their linking code. Needs a connected bot.
  require-bypass-ops: true
  # Server operators may join without a linked account.
updates:
# Optional version notices from the public Modrinth project dydiscord.
  notify: both
  # Notification audience: console, players, both. Players need the update permission.
  include-beta: false
  # Include future beta releases; superseded pre-1.0.0 release-line betas stay excluded.
  enabled: true
  # Checks compatible plugin versions every six hours; never downloads a JAR.
community:
# Public server information; addresses are owner supplied and never detected.
  java-address: ""
  # Java connection address (host or host:port); blank hides it. Reload applies.
  bedrock-address: ""
  # Optional Bedrock connection address; this does not install a Bedrock bridge.
  links: []
  # Up to ten entries with name and HTTPS url; no credentials/custom ports.
  server-fields: []
  # Up to ten name/value fields, name up to 80 and value up to 160 characters.
integrations:
# Optional connections to other plugins.
  placeholderapi: true
  # Register %dydiscord_...% placeholders when PlaceholderAPI is installed.
metrics:
# Anonymous statistics on bStats.org; no player names, IDs or messages are sent.
  enabled: true
  # Send anonymous plugin statistics. The global plugins/bStats/config.yml switch also applies.
cheat-check:
# /cheatcheck <player>: a screen title, chat message and sound, plus a Discord message when the player has linked.
  freeze: true
  # Keep the player in place and block commands outside allowed-commands until the check ends.
  reminder-seconds: 15
  # Repeat the title and sound this often in seconds; 0 shows them once.
  sound: "block.note_block.pling"
  # Minecraft sound key; blank plays no sound.
  allowed-commands: ["msg", "tell", "r", "w", "dydiscord", "discord", "link"]
  # Commands a frozen player may still use.
  quit-commands: []
  # Console commands when the player leaves during a check, for example "ban {player} Left during a cheat check". Up to ten.
reports:
# /report <player> <reason>: sends a report to staff in game and to the Discord reports channel in bot.yml.
  cooldown-seconds: 60
  # Wait between reports from the same player, in seconds (0-3600).
