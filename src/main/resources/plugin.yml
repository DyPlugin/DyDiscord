name: DyDiscord
version: '${version}'
main: dev.dydiscord.DyDiscord
api-version: '1.20'
folia-supported: true
author: Claww
softdepend: [LuckPerms, Vault, PlaceholderAPI, DyClaim, DyRTP, DyHomes]
description: Minecraft and Discord integration, account linking, chat and community tools by DyPlugin.
commands:
  dydiscord:
    description: DyDiscord account and administration commands
    aliases: [discord, dyd]
    usage: /dydiscord help
  dyda:
    description: DyDiscord administration commands
    usage: /dyda help
  dylink:
    description: Generate a private account linking code
    aliases: [link, esle, eşle, hesap-esle, hesap-eşle]
    usage: /dydiscord link
  cheatcheck:
    description: Start or end a cheat check on a player
    aliases: [hile-kontrol, hilekontrol, cheat-check]
    usage: /cheatcheck <player> [end] | /cheatcheck list
    permission: dydiscord.cheatcheck
  report:
    description: Report a player to the staff
    aliases: [rapor, dyreport]
    usage: /report <player> <reason>
    permission: dydiscord.report
permissions:
  dydiscord.player:
    default: true
    children:
      dydiscord.invite: true
      dydiscord.help: true
      dydiscord.link: true
      dydiscord.status: true
      dydiscord.unlink: true
      dydiscord.language: true
      dydiscord.chat.send: true
      dydiscord.chat.receive: true
      dydiscord.chat.preferences: true
      dydiscord.report: true
  dydiscord.admin:
    default: op
    children:
      dydiscord.player: true
      dydiscord.admin.prefix: true
      dydiscord.admin.bot.guild: true
      dydiscord.admin.alerts: true
      dydiscord.admin.chat: true
      dydiscord.admin.chat.channel: true
      dydiscord.admin.invite: true
      dydiscord.admin.language: true
      dydiscord.admin.reload: true
      dydiscord.admin.status: true
      dydiscord.admin.doctor: true
      dydiscord.admin.bot: true
      dydiscord.admin.panel.channel: true
      dydiscord.admin.panel.send: true
      dydiscord.admin.panel.refresh: true
      dydiscord.admin.panel.toggle: true
      dydiscord.admin.console.channel: true
      dydiscord.admin.console.toggle: true
      dydiscord.admin.console.commands: true
      dydiscord.admin.unlink: true
      dydiscord.admin.update: true
      dydiscord.admin.giveaway.start: true
      dydiscord.admin.giveaway.end: true
      dydiscord.admin.giveaway.cancel: true
      dydiscord.admin.giveaway.list: true
      dydiscord.admin.roles.status: true
      dydiscord.admin.roles.preview: true
      dydiscord.admin.roles.sync.all: true
      dydiscord.admin.roles.sync: true
      dydiscord.admin.roles.cleanup.preview: true
      dydiscord.admin.roles.cleanup.confirm: true
      dydiscord.cheatcheck: true
      dydiscord.cheatcheck.notify: true
      dydiscord.report.notify: true
  dydiscord.invite:
    default: false
  dydiscord.help:
    default: false
  dydiscord.link:
    default: false
  dydiscord.status:
    default: false
  dydiscord.unlink:
    default: false
  dydiscord.language:
    default: false
  dydiscord.admin.invite:
    default: false
  dydiscord.admin.language:
    default: false
  dydiscord.admin.reload:
    default: false
  dydiscord.admin.status:
    default: false
  dydiscord.admin.doctor:
    default: false
  dydiscord.admin.bot:
    default: false
  dydiscord.admin.panel.channel:
    default: false
  dydiscord.admin.panel.send:
    default: false
  dydiscord.admin.panel.refresh:
    default: false
  dydiscord.admin.panel.toggle:
    default: false
  dydiscord.admin.console.channel:
    default: false
  dydiscord.admin.console.toggle:
    default: false
  dydiscord.admin.console.commands:
    default: false
  dydiscord.admin.unlink:
    default: false
  dydiscord.admin.roles.status:
    default: false
  dydiscord.admin.roles.preview:
    default: false
  dydiscord.admin.roles.sync.all:
    default: false
  dydiscord.admin.roles.sync:
    default: false
  dydiscord.admin.roles.cleanup.preview:
    default: false
  dydiscord.admin.roles.cleanup.confirm:
    default: false
  dydiscord.admin.update:
    description: Receive compatible Modrinth update notifications
    default: false
  dydiscord.chat.send:
    description: Forward your public Minecraft chat to Discord
    default: false
  dydiscord.chat.receive:
    description: Receive public Discord chat in Minecraft
    default: false

  dydiscord.chat.preferences:
    default: false
  dydiscord.admin.giveaway.start:
    default: false
  dydiscord.admin.giveaway.end:
    default: false
  dydiscord.admin.giveaway.cancel:
    default: false
  dydiscord.admin.giveaway.list:
    default: false

  dydiscord.admin.prefix:
    default: false
  dydiscord.admin.bot.guild:
    default: false
  dydiscord.admin.alerts:
    default: false
  dydiscord.admin.chat:
    default: false
  dydiscord.admin.chat.channel:
    default: false
  dydiscord.cheatcheck:
    description: Start, end and list cheat checks
    default: false
  dydiscord.cheatcheck.notify:
    description: See cheat-check notices in game
    default: false
  dydiscord.cheatcheck.exempt:
    description: Cannot be put under a cheat check
    default: false
  dydiscord.report:
    description: Report players with /report
    default: false
  dydiscord.report.notify:
    description: See player reports in game and skip the report cooldown
    default: false
