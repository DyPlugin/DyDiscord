# Setting descriptions follow their settings.
config-version: 2
# Managed schema version. Do not edit.
enabled: true
# Connect automatically once token and guild-id are set. False explicitly stops the bot. First setup can be applied with admin reload; changing a running bot still needs restart.
token: ""
# Bot secret from Developer Portal. Never share it; environment token takes priority.
guild-id: ""
# Discord server ID, quoted as text. One guild is supported.
bot:
# Discord language: auto follows the configured game language (English when both are auto).
  language: auto
  # Bot/panel language: auto, en, tr, de, es or ru. Unset game language follows this choice. Restart applies.
  prefix: "dy!"
  # Message command prefix; the supported value is dy!.
  prefix-commands-enabled: true
  # Enable message commands; requires Message Content intent and bot restart.
panel:
# One persistent account panel; refresh updates its existing message.
  enabled: true
  # Use the account panel. False keeps slash commands available; reload applies it. Existing buttons are disabled; enabling refreshes the same recorded message.
  channel-id: ""
  # Text channel ID, quoted as text; must differ from console and chat channels.
  image-url: ""
  # Blank uses the Discord server icon. Optional HTTPS image URL; panel refresh applies it.
console:
# Server-console output channel; viewing it does not grant permission to run commands.
  enabled: false
  # Relay actual INFO/WARN/ERROR output to the configured channel; a blank channel disables delivery. Reload applies.
  channel-id: ""
  # Guild text channel ID, quoted as text. Public channels are allowed; command access requires separate authorization.
  commands:
  # These users receive full Minecraft console power; linking does not grant access.
    enabled: true
    # Allow new authorized messages to run Minecraft commands; requires bot restart.
    allow-administrator: true
    # Let Discord Administrators use the console in addition to allowed roles.
    allowed-role-ids: [""]
    # Trusted Discord role IDs as quoted strings; [""] allows no roles. Role names are not authorization.

roles:
# Optional Minecraft -> Discord roles. Linking never grants Minecraft permissions.
  enabled: false
  # Opt in explicitly; LuckPerms is required for group rules.
  linked-role-ids: [""]
  # Quoted Discord role IDs given to verified linked accounts; [""] grants no roles.
  groups: []
  # Rules: group: vip, role-ids: ["123456789012345678"], priority: 10. Group names are lowercase LuckPerms names; use a separate rule per group.
  context: {}
  # Explicit LuckPerms query context, for example {server: survival}.
  selection: all
  # all combines matching groups; highest combines rules tied at highest priority.
  recheck-seconds: 300
  # Reconcile known linked accounts periodically, in seconds (30-3600).
  member-events: true
  # Member join/update events need privileged Server Members intent when enabled. Changing the effective intent requires a bot restart.

chat:
# Optional public chat bridge. This channel must differ from panel and console.
  channel-id: ""
  # Public guild text channel ID, quoted as text; blank disables all chat delivery.
  minecraft-to-discord: true
  # Forward public Minecraft chat. Unknown chat listeners pause this direction.
  discord-to-minecraft: true
  # Forward new human Discord messages; enabling requires Message Content/bot restart.
  events:
  # Small event embeds; each event can be enabled independently.
    join:
    # Public joins only; hidden players and suppressed join messages are excluded.
      enabled: true
      # Announce joins in the chat channel.
      color: "#55AA55"
      # Embed accent as a six-digit RGB hex color.
    quit:
    # Public quits only; hidden players and suppressed quit messages are excluded.
      enabled: true
      # Announce quits in the chat channel.
      color: "#AAAAAA"
      # Embed accent as a six-digit RGB hex color.
    death:
    # Keep the existing death reason; suppressed death messages are excluded.
      enabled: true
      # Announce deaths in the chat channel.
      color: "#FF5555"
      # Embed accent as a six-digit RGB hex color.

boost-rewards:
# Optional Discord boost rewards, executed as Minecraft console commands.
  enabled: false
  # Explicit opt in. Enabling requests Server Members intent and needs bot restart. If that intent is unavailable, periodic fresh member checks continue.
  commands: [""]
  # Up to 10 console commands; {player} is the linked Minecraft name. Example: ["give {player} diamond 1"]. [""] runs nothing; max 256 characters each.
  remove-commands: [""]
  # Commands when a recorded boost ends or its link is removed; {player}/{uuid} target the linked account. [""] runs nothing.
  recheck-seconds: 300
  # Fresh linked-member reconciliation period, in seconds (30-3600).
  cooldown-hours: 168
  # Minimum hours between rewards for the same Discord account (168-8760).
community:
# Public Discord commands; empty list permits any regular text channel. Reload applies.
  information-channel-ids: [""]
  # Channels allowed for public information commands; empty permits every regular text channel.
link-rewards:
# First link only, once for BOTH accounts; existing/disabled links are never rewarded later.
  enabled: false
  # Enable one-time rewards for new account links.
  commands: [""]
  # Up to ten trusted console commands; {player}/{uuid} target the linked account. Example: ["give {player} diamond 1"]. [""] runs nothing; max 256 characters each.
link-welcome:
# Optional private welcome after permanent linking; no claim about reward success.
  minecraft: false
  # Send the linked player a private Minecraft welcome.
  discord: false
  # Send the linked member a private Discord welcome.
giveaways:
# Optional button-based giveaways; no economy commands are executed. Reload applies.
  enabled: false
  # Enable button-based Discord giveaways.
  channel-id: ""
  # Use a regular guild text channel, separate from panel and console.
  require-linked: false
  # Both entry and draw verify this condition; membership failures postpone drawing.
  allowed-role-ids: [""]
  # Optional OR rule: a member must hold at least one listed role ID. [""] imposes no role requirement; max twenty.

account:
# Private account details; reload applies these display options.
  show-integrated-roles: true
  # Show only currently assigned roles managed by role sync; never raw role IDs.
  time-zone: UTC
  # IANA time zone for readable account dates, for example Europe/Istanbul or UTC.
status-card:
# One live server status message that DyDiscord edits in place; reload applies.
  enabled: false
  # Show online status, player count and version in the channel below.
  channel-id: ""
  # Guild text channel ID, quoted as text; must differ from the console channel.
  interval-seconds: 60
  # Refresh period in seconds (30-3600). The card shows Offline after a normal shutdown.
plugin-logs:
# Events from DyClaim and DyRTP, posted as small embeds; a blank channel disables them. Reload applies.
  channel-id: ""
  # Guild text channel ID, quoted as text; must differ from the console channel.
  dyclaim:
  # Needs DyClaim 1.1.0 or newer.
    claims: true
    # Claims created and removed.
    trust: true
    # Players trusted or untrusted in a claim.
    transfers: true
    # Claim ownership transfers and market sales.
  dyrtp:
  # Needs DyRTP 1.0.0 or newer.
    teleports: true
    # Finished random teleports with their destination world.
  dyhomes:
  # Needs DyHomes 1.0.0 or newer.
    warps: true
    # Warps created, moved and deleted.
    public-homes: true
    # Homes made public or private.
    teleports: false
    # Every home, warp, spawn and /back teleport; off by default because it is frequent.
cheat-check:
# Discord side of /cheatcheck. Reload applies.
  voice-channel-id: ""
  # Voice channel the player is asked to join; blank leaves the channel out of the message.
  notify: dm
  # dm sends a private message, channel mentions the player in channel-id, both does both. A closed DM falls back to the channel.
  channel-id: ""
  # Guild text channel for channel notices, quoted as text.
  log-channel-id: ""
  # Staff log of started, ended and abandoned checks; blank uses plugin-logs.channel-id.
reports:
# Player reports from /report. Reload applies.
  channel-id: ""
  # Guild text channel for reports; blank keeps reports in game only.
  ping-role-id: ""
  # Optional role mentioned with each report, quoted as text.
moderation:
# Discord account sync for linked players. Reload applies; changing ban-sync to or from Discord reconnects the bot.
  nickname-sync: false
  # Set the Discord nickname of linked members to their Minecraft name. Needs Manage Nicknames; the server owner is skipped.
  nickname-format: "{name}"
  # Nickname pattern with {name}; at most 32 characters.
  ban-sync: "off"
  # off, minecraft-to-discord, discord-to-minecraft or both. Needs Ban Members on Discord for minecraft-to-discord.
