# Setting descriptions follow their settings.
panel-title: "{server_name} - Vincula tu cuenta"
# Title displayed on the account linking panel.
panel-description: "Para conectar tus cuentas de Minecraft y Discord, consigue tu código en el juego con `/discord link`, elige **Vincular cuenta** abajo e introduce el código.\n\n**Vincular cuenta:** Conecta tus cuentas con tu código del juego.\n\n**Mi cuenta:** Muestra tus cuentas de Minecraft y Discord vinculadas.\n\n**Desvincular:** Quita tu vinculación actual."
# Instructions displayed above the account panel buttons.
panel-privacy: "Solo tú puedes ver los datos de tu cuenta. No compartas tu código."
# Only you can see your account details. Keep your code private.
link: "Vincular cuenta"
# Link Account
account-button: "Mi cuenta"
# My Account
unlink: "Desvincular"
# Unlink
code-label: "Código de vinculación"
# Linking code
modal-title: "Vincula tu cuenta"
# Link Your Account
help: "Usa el panel de cuenta para vincular, ver o desvincular tu propia cuenta. Genera un código en Minecraft con /discord link. Los códigos caducan y no sobreviven a un reinicio del servidor."
# Guidance for linking and managing the user's own account.
help-card-title: "Comandos"
# Structured help card, shared by slash and prefix commands; no footer is added.
help-card-accounts: "Tus cuentas"
# Text shown for help card accounts.
help-card-account-commands: "`/link` — Introducir tu código del juego\n`/account` — Ver tus cuentas vinculadas\n`/unlink` — Quitar la vinculación"
# Text shown for help card account commands.
