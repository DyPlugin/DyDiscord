# Setting descriptions follow their settings.
panel-title: "{server_name} - Konto verknüpfen"
# Title displayed on the account linking panel.
panel-description: "Um deine Minecraft- und Discord-Konten zu verbinden, hol dir im Spiel mit `/discord link` deinen Code, wähle unten **Konto verknüpfen** und gib den Code ein.\n\n**Konto verknüpfen:** Verbindet deine Konten mit deinem Code aus dem Spiel.\n\n**Mein Konto:** Zeigt deine verknüpften Minecraft- und Discord-Konten.\n\n**Trennen:** Hebt deine bestehende Verknüpfung auf."
# Instructions displayed above the account panel buttons.
panel-privacy: "Nur du siehst deine Kontodaten. Halte deinen Code geheim."
# Only you can see your account details. Keep your code private.
link: "Konto verknüpfen"
# Link Account
account-button: "Mein Konto"
# My Account
unlink: "Trennen"
# Unlink
code-label: "Verknüpfungscode"
# Linking code
modal-title: "Konto verknüpfen"
# Link Your Account
help: "Mit dem Kontopanel verknüpfst, siehst oder trennst du dein eigenes Konto. Erzeuge in Minecraft mit /discord link einen Code. Codes laufen ab und überstehen keinen Serverneustart."
# Guidance for linking and managing the user's own account.
help-card-title: "Befehle"
# Structured help card, shared by slash and prefix commands; no footer is added.
help-card-accounts: "Deine Konten"
# Text shown for help card accounts.
help-card-account-commands: "`/link` — Code aus dem Spiel eingeben\n`/account` — Verknüpfte Konten ansehen\n`/unlink` — Kontoverknüpfung aufheben"
# Text shown for help card account commands.
