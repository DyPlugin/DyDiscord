commands-help: "Nutze /link, um deinen Code aus dem Spiel einzugeben, /account, um dein Konto anzusehen, oder /unlink, um die Verknüpfung aufzuheben. Deinen Code bekommst du in Minecraft mit /discord link. Antworten sind privat."
