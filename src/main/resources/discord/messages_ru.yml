# Setting descriptions follow their settings.
panel-title: "{server_name} - Привязка аккаунта"
# Title displayed on the account linking panel.
panel-description: "Чтобы связать аккаунты Minecraft и Discord, получите код в игре командой `/discord link`, затем нажмите **Привязать аккаунт** ниже и введите код.\n\n**Привязать аккаунт:** Связывает аккаунты по коду из игры.\n\n**Мой аккаунт:** Показывает привязанные аккаунты Minecraft и Discord.\n\n**Отвязать:** Удаляет текущую привязку."
# Instructions displayed above the account panel buttons.
panel-privacy: "Данные аккаунта видите только вы. Никому не сообщайте код."
# Only you can see your account details. Keep your code private.
link: "Привязать аккаунт"
# Link Account
account-button: "Мой аккаунт"
# My Account
unlink: "Отвязать"
# Unlink
code-label: "Код привязки"
# Linking code
modal-title: "Привязка аккаунта"
# Link Your Account
help: "Через панель аккаунта можно привязать, посмотреть или отвязать свой аккаунт. Получите код в Minecraft командой /discord link. Коды истекают и не сохраняются после перезапуска сервера."
# Guidance for linking and managing the user's own account.
help-card-title: "Команды"
# Structured help card, shared by slash and prefix commands; no footer is added.
help-card-accounts: "Ваши аккаунты"
# Text shown for help card accounts.
help-card-account-commands: "`/link` — Ввести код из игры\n`/account` — Посмотреть привязанные аккаунты\n`/unlink` — Удалить привязку"
# Text shown for help card account commands.
help-card-server: "Сервер и сообщество"
# Text shown for help card server.
help-card-other: "Справка и подключение"
# Text shown for help card other.
help-card-other-commands: "`/help` — Показать это меню\n`/status` — Показать состояние подключения бота\nКоманды в сообщениях работают и с префиксом `dy!`. Данные аккаунта показываются лично вам."
# Text shown for help card other commands.
