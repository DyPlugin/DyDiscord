# {server_name} - Link Your Account
panel-title: "{server_name} - Hesap Eşle"
# To connect your Minecraft and Discord accounts, get your code in-game with `/discord link`, then select **Link Account** below and enter you
panel-description: "Minecraft ve Discord hesaplarınızı bağlamak için oyunda `/discord eşle` yazıp kodunuzu alın. Ardından **Hesap Eşle** butonuna tıklayıp kodu girin.\n\n**Hesap Eşle:** Oyundaki kodunuzla hesaplarınızı eşleştirir.\n\n**Hesabım:** Eşleştirdiğiniz Minecraft ve Discord hesaplarını gösterir.\n\n**Eşlemeyi Kaldır:** Hesaplarınız arasındaki bağlantıyı kaldırır."
# Only you can see your account details. Keep your code private.
panel-privacy: "Hesap bilgilerinizi sadece siz görebilirsiniz. Kodunuzu kimseyle paylaşmayın."
# Link Account
link: "Hesap Eşle"
# My Account
account-button: "Hesabım"
# Unlink
unlink: "Eşlemeyi Kaldır"
# Linking code
code-label: "Eşleştirme kodunuz"
# Link Your Account
modal-title: "Hesap Eşle"
# Use the account panel to link, view or unlink your own account. Generate a code in Minecraft with /discord link. Codes expire and do not sur
help: "Hesaplarınızı eşleştirmek, eşleştirdiğiniz hesapları görmek veya eşleştirmeyi kaldırmak için hesap panelini kullanın. Kod almak için oyunda `/discord eşle` yazın. Kodların süresi dolduğunda, oyundan çıktığınızda veya sunucu yeniden başladığında yeni bir kod almanız gerekir."
